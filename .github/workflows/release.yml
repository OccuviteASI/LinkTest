# Build LinkTest on GitHub for every new VERSION on main and publish it as a release.
# Copies of LinkTest that were handed to other people (no source folder, no Python) update
# themselves from the latest release: see selfupdate.py and tools/release_info.py.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Is this version released yet?
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(python tools/release_info.py --version)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"; echo "v$v is already released; nothing to do."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"; echo "Building v$v."
          fi

      - uses: actions/setup-python@v5
        if: steps.ver.outputs.new == 'true'
        with:
          python-version: '3.12'
          cache: pip

      - name: Build
        if: steps.ver.outputs.new == 'true'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python fetch-helpers.py win64
          python build.py

      - name: Check that it starts
        if: steps.ver.outputs.new == 'true'
        shell: bash
        run: |
          ./dist/win64/LinkTest.exe --no-open --port 8799 &
          out=""
          for i in $(seq 1 60); do
            out=$(curl -s http://127.0.0.1:8799/api/ping || true)
            [ -n "$out" ] && break
            sleep 2
          done
          echo "answer: $out"
          taskkill //IM LinkTest.exe //F || true
          echo "$out" | grep -q "\"version\": \"${{ steps.ver.outputs.version }}\""

      - name: Publish the release
        if: steps.ver.outputs.new == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.ver.outputs.version }}"
          cp dist/win64/LinkTest.exe LinkTest-win64.exe
          python tools/release_info.py --write --asset win64=LinkTest-win64.exe --commit "$GITHUB_SHA"
          cat release.json
          gh release create "v$v" LinkTest-win64.exe release.json SHA256SUMS.txt \
            --title "LinkTest $v" --notes-file notes.md --target "$GITHUB_SHA"
